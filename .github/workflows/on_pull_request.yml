name: Deploy Infra (beta)

on:
  pull_request:
    branches: ["main"]
    paths:
      - "infra/**"
      - "lambda/**"

jobs:
  deploy-beta:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Build Lambda zip (processor)
        run: |
          cd ../lambda/processor
          rm -f processor.zip
          zip -r processor.zip lambda_function.py
          unzip -l processor.zip | head

      - name: Terraform Init (remote state beta)
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=multilingual-audio-pipeline/beta/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}" \
            -backend-config="encrypt=true"

      - name: Terraform Apply (beta)
        run: terraform apply -auto-approve -var-file=beta.tfvars
